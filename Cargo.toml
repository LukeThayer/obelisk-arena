[workspace]
resolver = "2"
members = ["crates/arena_skills", "crates/arena_game", "crates/arena_sim"]
# arena_editor is its OWN standalone workspace (see crates/arena_editor/Cargo.toml) — kept out of
# this workspace so the editor's heavy bevy features (dynamic_linking, ...) can't feature-unify onto
# arena_game / the net-test. Build it from crates/arena_editor directly.
exclude = ["crates/arena_editor"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Luke"]

[workspace.dependencies]
bevy = "0.18"
# `serialize` enables avian's serde for Position/Rotation/LinearVelocity — required by lightyear's
# avian3d feature (it replicates those components). 0.5 is PINNED by lightyear_avian3d 0.26 (Cargo
# treats 0.5 and 0.6 as distinct crates; can't bump until lightyear does).
avian3d = { version = "0.5", features = ["default", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
thiserror = "1"
anyhow = "1"
# lightyear 0.26.4: the transport + replication + interpolation layer. `input_native` adds the
# native input plugin (`ActionState<ArenaInput>` over the wire); `prediction` adds client-side
# prediction + rollback (and pulls in `lightyear_frame_interpolation`). NO `input_bei` (bei is a
# version-mismatch dead weight per the netcode guide §1.1).
lightyear = { version = "0.26.4", features = ["netcode", "udp", "avian3d", "interpolation", "input_native", "prediction"] }
# Visual frame-interpolation of the predicted local player's Position/Rotation between FixedUpdate
# ticks (the avian_3d_character example pattern). Pulled in transitively by lightyear's `prediction`
# feature; named directly here so `FrameInterpolationPlugin`/`FrameInterpolate` are importable.
lightyear_frame_interpolation = "0.26.4"
obelisk-bevy = { git = "https://github.com/LukeThayer/bevy-obelisk", branch = "main" }
# The pure-Rust stat library obelisk-bevy wraps; arena_game names `StatBlock` directly when
# building combatants (obelisk-bevy doesn't re-export it). Same path the plugin uses.
stat_core = { git = "ssh://git@github.com/vothuul/obelisk.git", branch = "master" }
# bevy_vfx (the editor's GPU particle engine) — the live-game particle upgrade: replaces the M1
# emissive-billboard stand-in so authored `.skillfx.ron` effects render in-game as they do in the
# skill-designer preview. Windowed-client-only at runtime (VfxPlugin is added only in the windowed
# build); the headless server/observer compile it but never add the plugin. Same crate the editor +
# arena_editor use (Bevy 0.18).
bevy_vfx = { git = "https://github.com/LukeThayer/bevy_modal_editor", branch = "main" }
arena_skills = { path = "crates/arena_skills" }
arena_sim = { path = "crates/arena_sim" }
